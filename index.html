    <script>
      // Silence Vite HMR WebSocket errors in AI Studio iframe environment
      (() => {
        const suppress = (arg) => {
          if (!arg) return false;
          const msg = (arg instanceof Error) ? (arg.message + ' ' + (arg.stack || '')) : String(arg);
          const lower = msg.toLowerCase();
          return lower.includes('[vite]') || lower.includes('websocket') || lower.includes('closed without opened') || lower.includes('@vite/client');
        };
        const origError = console.error;
        const origWarn = console.warn;
        console.error = (...args) => {
          if (args.some((arg) => suppress(arg))) return;
          origError.apply(console, args);
        };
        console.warn = (...args) => {
          if (args.some((arg) => suppress(arg))) return;
          origWarn.apply(console, args);
        };

        window.onerror = (message, source, lineno, colno, error) => {
          if (suppress(message) || suppress(error) || (source && suppress(source))) {
            return true;
          }
        };

        window.addEventListener('error', (event) => {
          const errText = (event.error ? (event.error.message + ' ' + (event.error.stack || '')) : '') + ' ' + (event.message || '') + ' ' + (event.filename || '');
          if (suppress(errText) || suppress(event.error) || (event.filename && suppress(event.filename))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', (event) => {
          if (event.reason && suppress(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Virtual WebSocket implementation for Vite HMR to prevent "WebSocket closed without opened" errors
        try {
          const OrigWS = window.WebSocket;

          class ViteHmrMockSocket extends EventTarget {
            constructor(url, protocols) {
              super();
              this.url = String(url || '');
              this.protocol = Array.isArray(protocols) ? (protocols[0] || 'vite-hmr') : String(protocols || 'vite-hmr');
              this.readyState = 0; // CONNECTING
              this.binaryType = 'blob';
              this.bufferedAmount = 0;
              this.extensions = '';
              this.onopen = null;
              this.onclose = null;
              this.onerror = null;
              this.onmessage = null;

              setTimeout(() => {
                if (this.readyState === 0) {
                  this.readyState = 1; // OPEN
                  const ev = new Event('open');
                  this.dispatchEvent(ev);
                  if (typeof this.onopen === 'function') {
                    try { this.onopen(ev); } catch (_) {}
                  }
                }
              }, 5);
            }

            send(data) {}

            close(code, reason) {
              if (this.readyState !== 3) {
                this.readyState = 3; // CLOSED
                const ev = typeof CloseEvent !== 'undefined'
                  ? new CloseEvent('close', { code: code || 1000, reason: reason || 'Normal Closure', wasClean: true })
                  : new Event('close');
                this.dispatchEvent(ev);
                if (typeof this.onclose === 'function') {
                  try { this.onclose(ev); } catch (_) {}
                }
              }
            }
          }
          ViteHmrMockSocket.CONNECTING = 0;
          ViteHmrMockSocket.OPEN = 1;
          ViteHmrMockSocket.CLOSING = 2;
          ViteHmrMockSocket.CLOSED = 3;

          const isHmrTarget = (url, protocols) => {
            const u = typeof url === 'string' ? url : (url && url.href ? String(url.href) : '');
            const p = Array.isArray(protocols) ? protocols.join(' ') : String(protocols || '');
            return (
              p.includes('vite-hmr') ||
              u.includes('vite-hmr') ||
              u.includes('token=') ||
              u.includes('/@vite/') ||
              (u.includes('ais-dev') && (u.includes('ws://') || u.includes('wss://')))
            );
          };

          function PatchedWebSocket(url, protocols) {
            if (isHmrTarget(url, protocols)) {
              return new ViteHmrMockSocket(url, protocols);
            }
            if (OrigWS) {
              return new OrigWS(url, protocols);
            }
            return new ViteHmrMockSocket(url, protocols);
          }

          PatchedWebSocket.CONNECTING = 0;
          PatchedWebSocket.OPEN = 1;
          PatchedWebSocket.CLOSING = 2;
          PatchedWebSocket.CLOSED = 3;
          if (OrigWS) {
            PatchedWebSocket.prototype = OrigWS.prototype;
          } else {
            PatchedWebSocket.prototype = ViteHmrMockSocket.prototype;
          }

          window.WebSocket = PatchedWebSocket;
        } catch (_) {}

        // Resilient storage & cookie protection against third-party iframe blocking
        try {
          const testKey = '__mbk_storage_test__';
          window.localStorage.setItem(testKey, '1');
          window.localStorage.removeItem(testKey);
        } catch (_) {
          const mem = new Map();
          const polyfill = {
            getItem: (k) => mem.get(String(k)) ?? null,
            setItem: (k, v) => mem.set(String(k), String(v)),
            removeItem: (k) => mem.delete(String(k)),
            clear: () => mem.clear(),
            key: (i) => Array.from(mem.keys())[i] ?? null,
            get length() { return mem.size; }
          };
          try { Object.defineProperty(window, 'localStorage', { value: polyfill, configurable: true, writable: true }); } catch (_) {}
          try { Object.defineProperty(window, 'sessionStorage', { value: polyfill, configurable: true, writable: true }); } catch (_) {}
        }
      })();
    </script>
