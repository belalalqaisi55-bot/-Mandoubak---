    <script>
      // Silence Vite HMR WebSocket errors in AI Studio iframe environment
      (() => {
        const suppress = (arg) => {
          if (!arg) return false;
          const msg = (arg instanceof Error) ? (arg.message + ' ' + (arg.stack || '')) : String(arg);
          const lower = msg.toLowerCase();
          return lower.includes('[vite]') || lower.includes('websocket') || lower.includes('closed without opened');
        };
        const origError = console.error;
        const origWarn = console.warn;
        console.error = (...args) => {
          if (args.some((arg) => suppress(arg))) return;
          origError.apply(console, args);
        };
        console.warn = (...args) => {
          if (args.some((arg) => suppress(arg))) return;
          origWarn.apply(console, args);
        };
        window.addEventListener('error', (event) => {
          const errText = (event.error ? (event.error.message + ' ' + (event.error.stack || '')) : '') + ' ' + (event.message || '');
          if (suppress(errText) || suppress(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', (event) => {
          if (event.reason && suppress(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Resilient storage & cookie protection against third-party iframe blocking
        try {
          const testKey = '__mbk_storage_test__';
          window.localStorage.setItem(testKey, '1');
          window.localStorage.removeItem(testKey);
        } catch (_) {
          const mem = new Map();
          const polyfill = {
            getItem: (k) => mem.get(String(k)) ?? null,
            setItem: (k, v) => mem.set(String(k), String(v)),
            removeItem: (k) => mem.delete(String(k)),
            clear: () => mem.clear(),
            key: (i) => Array.from(mem.keys())[i] ?? null,
            get length() { return mem.size; }
          };
          try { Object.defineProperty(window, 'localStorage', { value: polyfill, configurable: true, writable: true }); } catch (_) {}
          try { Object.defineProperty(window, 'sessionStorage', { value: polyfill, configurable: true, writable: true }); } catch (_) {}
        }
      })();
    </script>
